name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Initialize Project & Install Capacitor
        run: |
          # إنشاء ملف التعريف إذا لم يكن موجوداً
          if [ ! -f package.json ]; then
            npm init -y
          fi
          # تثبيت المكتبات اللازمة
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android Platform from Scratch
        run: |
          # حذف أي مجلد قديم يسبب تعارض
          rm -rf android
          # إنشاء إعدادات الكاباسيتور
          npx cap init "My App" "com.example.app" --web-dir . --confirm
          # إضافة منصة الأندرويد وتوليد ملفاتها تلقائياً
          npx cap add android
          npx cap sync android

      - name: Build APK (Debug Version)
        run: |
          cd android
          # إعطاء صلاحية التنفيذ لمحرك بناء الأندرويد
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: Android-App-Success
          path: android/app/build/outputs/apk/debug/app-debug.apk
